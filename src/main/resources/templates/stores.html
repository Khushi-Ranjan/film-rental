<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
  <title th:fragment="title">Stores</title>
</head>
<body>
<main th:fragment="main">
  <header class="page-header">
    <h1 class="page-title">Stores</h1>
    <p class="page-subtitle">Open a store and view its inventory.</p>
  </header>

  <section class="panel">
    <h2 class="panel-title">Lookup</h2>
    <form class="form" th:action="@{/stores/1}" method="get"
          onsubmit="this.action=this.action.replace('/1','/' + this.storeId.value)">
      <label class="field">
        <span>Store ID</span>
        <input name="storeId" type="number" min="1" required placeholder="e.g. 1">
      </label>
      <button class="btn btn-primary" type="submit">Open store</button>
      <p class="hint">Try <strong>1</strong> or <strong>2</strong> (Sakila default).</p>
    </form>
  </section>
</main>
</body>
</html>
